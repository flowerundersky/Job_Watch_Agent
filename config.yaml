model_backend:
  backend: openai_compatible
  # api_base_url: "你的url"
  # api_key: "你的key"
  model: "gpt-5.5"
  timeout_seconds: 60
  temperature: 0.2
  max_tokens: 4096
runtime:
  output_dir: output
  timeout_seconds: 30
  browser_name: firefox
  render_retries: 2
  max_crawl_chars: 12000
  max_links_per_page: 20
  trace_filename: result_output/job_watch_trace.md
